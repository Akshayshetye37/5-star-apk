@keyframes aureliaBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.015)}}

<script>
const MODULES=[
 ['dashboard','Dashboard'],['reservations','Reservations'],['bookings','Bookings'],['guests','Guests'],['rooms','Rooms'],
 ['folio','Folio / Dues'],['invoices','Invoices'],['housekeeping','Housekeeping'],['pos','POS / Food'],['expenses','Expenses'],
 ['reports','Reports'],['audit','Audit'],['importExport','Import / Export'],['settings','Settings']
];

const seed={
 settings:{features:{},hotelName:'AURELIA 5★ HOTEL',phone:'+91',address:'Hotel address',gst:'',upi:'hotel@upi',currency:'₹',paymentAnnouncement:true,logo:'',checkoutMessage:'Thank you for staying with us. We hope to welcome you again.',dueAlertHours:5},
 rooms:[
  {id:'r101',number:'101',type:'Standard',rate:3000,status:'available'},
  {id:'r102',number:'102',type:'Deluxe',rate:4500,status:'occupied'},
  {id:'r201',number:'201',type:'Suite',rate:5200,status:'available'},
  {id:'r301',number:'301',type:'Standard',rate:3000,status:'reserved'}
 ],
 guests:[
  {id:'g1',name:'Priya Deshmukh',phone:'919876543210',email:'',idType:'Passport',idNumber:'P-DEMO-01',idPhoto:'',occupants:[],vehicles:[{id:'v1',reg:'MH12AB1234',type:'Car',photo:''}]},
  {id:'g2',name:'Arjun Malhotra',phone:'919812345678',email:'',idType:'Aadhaar',idNumber:'XXXX-XXXX-1234',idPhoto:'',occupants:[],vehicles:[]}
 ],
 bookings:[
  {id:'b1',sr:'BKG-001001',guestId:'g1',roomId:'r102',checkIn:'2026-10-06T12:00',checkOut:'2026-10-08T11:00',guests:1,base:9000,discount:500,paid:9500,status:'active',charges:[
    {id:'c1',item:'Room charges',qty:1,rate:9000,amount:9000,at:'2026-10-06T12:00'},
    {id:'c2',item:'Water Bottle',qty:2,rate:30,amount:60,at:'2026-10-06T15:20'},
    {id:'c3',item:'Pomfret',qty:1,rate:850,amount:850,at:'2026-10-06T19:05'}
  ],payments:[{id:'p1',amount:9500,method:'UPI',status:'verified',at:'2026-10-06T20:00',ref:'TXN-DEMO-001'}]},
  {id:'b2',sr:'BKG-001002',guestId:'g2',roomId:'r201',checkIn:'2026-10-06T14:00',checkOut:'2026-10-06T20:00',guests:1,base:10000,discount:0,paid:3000,status:'active',charges:[
    {id:'c4',item:'Room charges',qty:1,rate:10000,amount:10000,at:'2026-10-06T14:00'}
  ],payments:[{id:'p2',amount:3000,method:'Cash',status:'verified',at:'2026-10-06T14:10',ref:'CASH-001'}]}
 ],
 inventory:[
  {id:'i1',name:'Water Bottle',unit:'bottle',opening:100,purchased:1000,issued:580,waste:20,sell:30,reorder:100},
  {id:'i2',name:'Soap',unit:'piece',opening:50,purchased:0,issued:2,waste:0,sell:20,reorder:10},
  {id:'i3',name:'Pomfret',unit:'piece',opening:20,purchased:0,issued:0,waste:0,sell:850,reorder:5}
 ],
 expenses:[{id:'e1',title:'Cleaning supplies',amount:500,category:'Operations',at:'2026-10-06T10:00',status:'active'}],
 reservations:[{id:'res1',sr:'RES-000001',guestId:'g1',roomId:'r301',from:'2026-10-20T14:00',to:'2026-10-22T11:00',status:'confirmed'}],
 audit:[{id:'a1',at:'2026-10-06T20:00',action:'Payment verified',detail:'₹9,500 · BKG-001001'}],
 seq:{booking:1002,reservation:1,invoice:1,expense:2}
};
let DB=JSON.parse(localStorage.getItem('aurelia_pms_v3')||'null')||seed;
DB.settings=DB.settings||{};DB.settings.features=DB.settings.features||{};feature_keys_placeholder=undefined;
function save(){localStorage.setItem('aurelia_pms_v3',JSON.stringify(DB))}
function money(n){return `${DB.settings.currency||'₹'}${Number(n||0).toLocaleString('en-IN')}`}
function guest(b){return DB.guests.find(g=>g.id===b.guestId)}
function room(b){return DB.rooms.find(r=>r.id===b.roomId)}
function nightsBetween(a,b){const x=new Date(a),y=new Date(b);if(!a||!b||Number.isNaN(x)||Number.isNaN(y)||y<=x)return 1;return Math.max(1,Math.ceil((y-x)/86400000))}
function bookingRoomAmount(roomId,checkIn,checkOut){const r=DB.rooms.find(x=>x.id===roomId);return Number(r?.rate||0)*nightsBetween(checkIn,checkOut)}
function recalcBooking(b){if(!b)return 0;const r=room(b),n=nightsBetween(b.checkIn,b.checkOut),roomAmt=Number(r?.rate||b.base||0)*n;b.base=roomAmt;b.charges=b.charges||[];const roomCharge=b.charges.find(c=>c.item==='Room charges');if(roomCharge){roomCharge.qty=n;roomCharge.rate=Number(r?.rate||roomCharge.rate||0);roomCharge.amount=roomAmt}else b.charges.unshift({id:'c'+Date.now(),item:'Room charges',qty:n,rate:Number(r?.rate||0),amount:roomAmt,at:b.checkIn});return roomAmt}
function total(b){return Math.max(0,(b.charges||[]).reduce((s,c)=>s+Number(c.amount||0),0)-Number(b.discount||0))}
function due(b){return Math.max(0,total(b)-Number(b.paid||0))}
function paymentStatus(b){const d=due(b);return d<=0?'PAID':Number(b.paid||0)>0?'PART PAID':'UNPAID'}
function currentCycleTransactions(i){const start=new Date(i.cycleStartedAt||0).getTime();return DB.inventoryLedger.filter(t=>t.itemId===i.id&&new Date(t.at).getTime()>=start)}
function remaining(i){const tx=currentCycleTransactions(i);return Math.max(0,Number(i.opening||0)+tx.filter(t=>t.type==='purchase').reduce((s,t)=>s+Number(t.qty||0),0)-tx.filter(t=>t.type==='sale').reduce((s,t)=>s+Number(t.qty||0),0)-tx.filter(t=>t.type==='waste').reduce((s,t)=>s+Number(t.qty||0),0))}
function inventoryPeriodRange(period){const end=Date.now();let start=0;if(period==='Daily')start=end-86400000;else if(period==='Weekly')start=end-7*86400000;else if(period==='Monthly')start=end-30*86400000;else if(period==='Yearly')start=end-365*86400000;return {start,end,label:period}}
function inventoryPeriodRows(period){const {start,end}=inventoryPeriodRange(period);return DB.inventoryLedger.filter(t=>{const tm=new Date(t.at).getTime();return tm>=start&&tm<=end&&(t.type==='purchase'||t.type==='sale'||t.type==='waste')})}
function inventoryReport(period){const rows=period==='All Time'?DB.inventoryLedger.filter(t=>t.type==='purchase'||t.type==='sale'||t.type==='waste'):inventoryPeriodRows(period);const purchased=rows.filter(x=>x.type==='purchase').reduce((s,x)=>s+Number(x.amount||0),0),sales=rows.filter(x=>x.type==='sale').reduce((s,x)=>s+Number(x.amount||0),0),qtyPurchased=rows.filter(x=>x.type==='purchase').reduce((s,x)=>s+Number(x.qty||0),0),qtySold=rows.filter(x=>x.type==='sale').reduce((s,x)=>s+Number(x.qty||0),0),waste=rows.filter(x=>x.type==='waste').reduce((s,x)=>s+Number(x.qty||0),0);return {period,rows,purchased,sales,qtyPurchased,qtySold,waste,net:sales-purchased}}
DB.inventoryLedger=Array.isArray(DB.inventoryLedger)?DB.inventoryLedger:[];
DB.inventory.forEach(i=>{
 if(!i.cycleStartedAt){
  const oldOpening=Number(i.opening||0),oldPurchased=Number(i.purchased||0),oldIssued=Number(i.issued||0),oldWaste=Number(i.waste||0),hist=new Date(Date.now()-86400000).toISOString(),now=new Date().toISOString();
  if(oldOpening)DB.inventoryLedger.push({id:'mig-open-'+i.id,type:'opening',itemId:i.id,qty:oldOpening,amount:0,at:hist,note:'Migrated opening stock'});
  if(oldPurchased)DB.inventoryLedger.push({id:'mig-purchase-'+i.id,type:'purchase',itemId:i.id,qty:oldPurchased,unitCost:0,amount:0,at:hist,note:'Migrated historical purchase'});
  if(oldIssued)DB.inventoryLedger.push({id:'mig-sale-'+i.id,type:'sale',itemId:i.id,qty:oldIssued,unitPrice:Number(i.sell||0),amount:oldIssued*Number(i.sell||0),at:hist,note:'Migrated historical sold stock'});
  if(oldWaste)DB.inventoryLedger.push({id:'mig-waste-'+i.id,type:'waste',itemId:i.id,qty:oldWaste,amount:0,at:hist,note:'Migrated historical waste'});
  i.opening=Math.max(0,oldOpening+oldPurchased-oldIssued-oldWaste);i.purchased=0;i.issued=0;i.waste=0;i.cycleStartedAt=now;
 }
});
save();

function fmt(d){return new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function audit(action,detail){DB.audit.unshift({id:'a'+Date.now(),at:new Date().toISOString(),action,detail});save()}


function featureEnabled(key){return DB.settings.features?.[key]!==false}
function toggleFeature(key,on){
 DB.settings.features=DB.settings.features||{};
 DB.settings.features[key]=!!on;
 save();audit('Feature toggle changed',`${key}: ${on?'ON':'OFF'}`);save();
 const el=document.querySelector(`[data-feature="${key}"]`);if(el&&el.parentElement?.nextElementSibling)el.parentElement.nextElementSibling.textContent=on?'Enabled':'Disabled';
}
function setAllFeatures(on){
 DB.settings.features=DB.settings.features||{};
 document.querySelectorAll('[data-feature]').forEach(el=>{el.checked=on;DB.settings.features[el.dataset.feature]=on});
 save();audit('Master features changed',on?'All features enabled':'All features disabled');save();showPage('settings');toast(on?'All features enabled':'All features disabled');
}
function getExportRecords(scope){
 if(scope==='guest')return DB.guests.map(g=>({id:g.id,label:g.name}));
 if(scope==='booking')return DB.bookings.map(b=>({id:b.id,label:`${b.sr} · ${guest(b)?.name||''}`}));

 if(scope==='folio')return DB.bookings.filter(b=>b.status==='active').map(b=>({id:b.id,label:`${b.sr} · Room ${room(b)?.number||''}`}));
 return [{id:'all',label:'Entire PMS data'}];

 }).join('');

function openInventoryPurchase(itemId){
 const i=itemId&&DB.inventory.find(x=>x.id===itemId);
 openModal('Record inventory purchase',`<div class="form-grid"><div class="field full"><label>Item</label><select id="purchaseItem">${DB.inventory.map(x=>`<option value="${x.id}" ${x.id===itemId?'selected':''}>${esc(x.name)} · current ${remaining(x)} ${esc(x.unit)}</option>`).join('')}</select></div>${field('Quantity purchased','purchaseQty',1)}${field('Unit purchase cost','purchaseCost',0)}${field('Supplier / reference','purchaseRef','')}</div><div class="muted">This adds to existing stock. It does not replace previous purchases.</div>`,
 `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="commitInventoryPurchase()">Add purchase</button>`);
}
function commitInventoryPurchase(){
 const itemId=document.getElementById('purchaseItem').value,i=DB.inventory.find(x=>x.id===itemId),qty=Number(document.getElementById('purchaseQty').value),cost=Number(document.getElementById('purchaseCost').value||0),ref=document.getElementById('purchaseRef').value||'';
 if(!i||qty<=0||cost<0){toast('Enter valid purchase details');return}
 DB.inventoryLedger.push({id:'t'+Date.now(),type:'purchase',itemId,qty,unitCost:cost,amount:qty*cost,at:new Date().toISOString(),ref});
 audit('Inventory purchase',`${i.name} +${qty} ${i.unit} · ${money(qty*cost)}`);save();closeModal();showPage('pos');toast(`${qty} ${i.unit} added to ${i.name}`);
}
function issuePOS(itemId){
 const i=DB.inventory.find(x=>x.id===itemId),active=DB.bookings.filter(b=>b.status==='active');if(!active.length){toast('No active stay available');return}
 openModal('Sell / issue inventory to guest',`<div class="form-grid"><div class="field full"><label>Stay</label><select id="issueBooking">${active.map(b=>`<option value="${b.id}">${b.sr} · Room ${room(b)?.number} · ${guest(b)?.name}</option>`).join('')}</select></div>${field('Quantity','issueQty',1)}${field('Price per unit','issueRate',i.sell)}</div><div class="muted">Available stock: <b>${remaining(i)} ${i.unit}</b>. The sale is committed to both inventory and the guest folio in one save.</div>`,
 `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="commitIssue('${itemId}')">Sell + post folio</button>`);
}
function commitIssue(itemId){
 const i=DB.inventory.find(x=>x.id===itemId),qty=Number(document.getElementById('issueQty').value),rate=Number(document.getElementById('issueRate').value),bid=document.getElementById('issueBooking').value,b=DB.bookings.find(x=>x.id===bid);
 if(!i||!b||qty<=0||qty>remaining(i)||rate<0){toast('Invalid quantity, price, or insufficient stock');return}
 const now=new Date().toISOString(),amount=qty*rate;
 DB.inventoryLedger.push({id:'t'+Date.now(),type:'sale',itemId,qty,unitPrice:rate,amount,at:now,bookingId:bid,guestId:b.guestId,note:'POS sale'});
 b.charges=b.charges||[];b.charges.push({id:'c'+Date.now(),item:i.name,qty,rate,amount,at:now,source:'POS',inventoryTransactionId:'t'+Date.now()});
 audit('POS sale',`${i.name} × ${qty} · ${money(amount)} · ${b.sr}`);save();closeModal();showPage('pos');toast(`${i.name}: ${qty} sold · ${money(amount)} posted to folio`);
}
function resetInventoryCycle(){
 if(!confirm('Start a new stock cycle? Current stock becomes the new opening balance. All old transactions remain in the all-time ledger.'))return;
 const now=new Date().toISOString();
 DB.inventory.forEach(i=>{const current=remaining(i);i.opening=current;i.cycleStartedAt=now;i.purchased=0;i.issued=0;i.waste=0});
 audit('Inventory cycle reset','Current stock moved to new opening balances; history preserved');save();showPage('pos');toast('Inventory cycle reset. Historical records preserved.');
}
function inventoryHistory(id){
 const i=DB.inventory.find(x=>x.id===id); if(!i)return;
 const rows=DB.inventoryLedger.filter(t=>t.itemId===id).sort((a,b)=>new Date(b.at)-new Date(a.at));
 openModal(`${esc(i.name)} · Full inventory history`,`<div class="row"><span>Current stock <b>${remaining(i)} ${esc(i.unit)}</b></span><span>Sell price <b>${money(i.sell)}</b></span></div><div class="list" style="margin-top:12px">${rows.map(t=>`<div class="item"><div class="item-head"><div><b>${t.type.toUpperCase()}</b><div class="muted">${fmt(t.at)} · ${t.qty} ${esc(i.unit)}</div></div><b>${t.amount?money(t.amount):''}</b></div><div class="muted">${esc(t.note||t.ref||'')}</div></div>`).join('')||'<div class="empty">No history</div>'}</div>`,`<button class="btn" onclick="exportInventoryReport('All Time','csv')">Export all inventory</button><button class="btn primary" onclick="closeModal()">Close</button>`);
}
function inventoryBalanceSheet(period){
 const r=inventoryReport(period);
 const byItem=DB.inventory.map(i=>{const rows=r.rows.filter(t=>t.itemId===i.id);return {name:i.name,purchase:rows.filter(t=>t.type==='purchase').reduce((s,t)=>s+Number(t.amount||0),0),sales:rows.filter(t=>t.type==='sale').reduce((s,t)=>s+Number(t.amount||0),0),soldQty:rows.filter(t=>t.type==='sale').reduce((s,t)=>s+Number(t.qty||0),0),purchaseQty:rows.filter(t=>t.type==='purchase').reduce((s,t)=>s+Number(t.qty||0),0)}}).filter(x=>x.purchase||x.sales||x.soldQty||x.purchaseQty);
 openModal(`Inventory balance sheet · ${period}`,`<div class="grid three">${kpi('Sales / income',money(r.sales),'Inventory sold')}${kpi('Purchases / expense',money(r.purchased),'Stock bought')}${kpi('Net',money(r.net),'Income − purchase expense')}</div><div class="row" style="margin:14px 0"><span>Purchased qty <b>${r.qtyPurchased}</b></span><span>Sold qty <b>${r.qtySold}</b></span><span>Waste qty <b>${r.waste}</b></span></div><div class="list">${byItem.map(x=>`<div class="item"><div class="item-head"><b>${esc(x.name)}</b><b>${money(x.sales-x.purchase)}</b></div><div class="muted">Bought ${x.purchaseQty} · Sold ${x.soldQty} · Income ${money(x.sales)} · Expense ${money(x.purchase)}</div></div>`).join('')||'<div class="empty">No inventory activity for this period</div>'}</div>`,`<button class="btn" onclick="exportInventoryReport('${period}','csv')">Export CSV</button><button class="btn" onclick="exportInventoryReport('${period}','json')">Export JSON</button><button class="btn primary" onclick="closeModal()">Close</button>`);
}
function exportInventoryReport(period,format){
 const r=inventoryReport(period),rows=[['Date','Type','Item','Qty','Unit price/cost','Amount','Booking','Guest']];
 r.rows.sort((a,b)=>new Date(a.at)-new Date(b.at)).forEach(t=>{const i=DB.inventory.find(x=>x.id===t.itemId),b=t.bookingId?DB.bookings.find(x=>x.id===t.bookingId):null;rows.push([t.at,t.type,i?.name||'',t.qty,t.unitPrice??t.unitCost??'',t.amount||0,b?.sr||'',guest(b)?.name||''])});
 if(format==='json'){downloadBlob(new Blob([JSON.stringify({period,summary:r,rows:r.rows},null,2)],{type:'application/json'}),`inventory-${period.toLowerCase().replaceAll(' ','-')}.json`);return}
 const csv=rows.map(row=>row.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');downloadBlob(new Blob([csv],{type:'text/csv'}),`inventory-${period.toLowerCase().replaceAll(' ','-')}.csv`);
}

 const csv=[['Date','Type','Item','Qty','Unit price/cost','Amount','Booking','Guest'],[t.at,t.type,i?.name||'',t.qty,t.unitPrice??t.unitCost??'',t.amount||0,b?.sr||'',guest(b)?.name||'']].map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');downloadBlob(new Blob([csv],{type:'text/csv'}),`inventory-record-${id}.csv`);
}

function convertReservation(id){const x=DB.reservations.find(r=>r.id===id);if(!x)return;const r=room({roomId:x.roomId});const g=guest({guestId:x.guestId});const b={id:'b'+Date.now(),sr:'BKG-'+String(DB.seq.booking++).padStart(6,'0'),guestId:g.id,roomId:r.id,checkIn:x.from,checkOut:x.to,guests:1,base:r.rate,discount:0,paid:0,status:'active',charges:[{id:'c'+Date.now(),item:'Room charges',qty:1,rate:r.rate,amount:r.rate,at:x.from}],payments:[]};DB.bookings.unshift(b);x.status='converted';r.status='occupied';audit('Reservation converted',`${x.sr} → ${b.sr}`);save();showPage('bookings');toast('Reservation converted to active stay')}
function cancelReservation(id){const x=DB.reservations.find(r=>r.id===id);if(!x)return;if(!confirm('Cancel this reservation?'))return;x.status='cancelled';audit('Reservation cancelled',x.sr);save();showPage('reservations')}

function searchAll(q){
 q=q.trim().toLowerCase();if(!q)return[];const out=[];
 DB.guests.forEach(g=>{if(`${g.name} ${g.phone} ${g.idNumber}`.toLowerCase().includes(q))out.push({group:'Guests',title:g.name,sub:`${g.phone||''} · ${g.idType||''}`,fn:()=>openGuest(g.id)})});
 DB.rooms.forEach(r=>{if(`${r.number} ${r.type} ${r.status}`.toLowerCase().includes(q))out.push({group:'Rooms',title:`Room ${r.number}`,sub:`${r.type} · ${r.status}`,fn:()=>showPage('rooms')})});
 DB.bookings.forEach(b=>{if(`${b.sr} ${guest(b)?.name||''}`.toLowerCase().includes(q))out.push({group:'Bookings',title:b.sr,sub:`${guest(b)?.name||''} · Room ${room(b)?.number||''}`,fn:()=>openBooking(b.id)})});
 DB.reservations.forEach(x=>{if(`${x.sr} ${guest({guestId:x.guestId})?.name||''}`.toLowerCase().includes(q))out.push({group:'Reservations',title:x.sr,sub:guest({guestId:x.guestId})?.name||'',fn:()=>showPage('reservations')})});
 DB.inventory.forEach(i=>{if(i.name.toLowerCase().includes(q))out.push({group:'POS',title:i.name,sub:`Remaining ${remaining(i)}`,fn:()=>showPage('pos')})});
 return out.slice(0,30);
}
function initSearch(){
 const input=document.getElementById('search'),box=document.getElementById('searchResults');
 input.addEventListener('input',()=>{const rs=searchAll(input.value);box.innerHTML=rs.map((x,i)=>`<div class="sr" data-result="${i}"><b>${esc(x.title)}</b><small>${esc(x.group)} · ${esc(x.sub)}</small></div>`).join('');box.classList.toggle('show',rs.length>0);box.querySelectorAll('[data-result]').forEach(el=>el.onclick=()=>{rs[+el.dataset.result].fn();box.classList.remove('show')})});
}
setupNav();initSearch();refreshBrand();showPage('dashboard');window.addEventListener('beforeunload',save);
</script>
</body></html>
