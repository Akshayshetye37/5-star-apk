name: Aurelia Hotel PMS Android APK

on:
  push:
    branches:
      - enterprise-41-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Java version
        run: java -version

      - name: Gradle version
        run: ./gradlew --version

      - name: Gradle task discovery
        run: ./gradlew :app:tasks --all

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Find APK
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-hotel-pms-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
