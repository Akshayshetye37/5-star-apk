name: Aurelia PMS Android Debug APK

on:
  push:
    branches:
      - aurelia-native-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Aurelia branch
        uses: actions/checkout@v4
        with:
          ref: aurelia-native-ui

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Aurelia debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "=== Aurelia APK ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Aurelia APK
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pms-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

# Aurelia CI active
