name: Enterprise PMS Android Debug APK

on:
  push:
    branches:
      - enterprise-41-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout enterprise Android project
        uses: actions/checkout@v4
        with:
          ref: enterprise-41-implementation

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-pms-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
